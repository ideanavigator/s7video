[project]
name = "s7engine"
version = "0.0.0"
description = "s7video local video engine"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "jsonschema>=4.23",
  # Captions for export (S7V-028).
  "pysubs2>=1.8,<1.9",
  # Transcription (S7V-026, ADR-006): Qwen3-ASR and Qwen3-ForcedAligner on MLX, Apple Silicon only.
  "mlx==0.32.4",
  "mlx-audio==0.6.4",
  "huggingface_hub>=2.4,<3",
  "numpy>=2.2",
  "opentimelineio==0.18.1",
  "otio-fcpx-xml-adapter==1.0.0",
  "otio-fcp-adapter==1.0.0",
  "otio-cmx3600-adapter==1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Golden media tests are named `<case_name>_golden.py` (S7V-031, `pnpm test:golden`).
python_files = ["test_*.py", "*_golden.py"]
